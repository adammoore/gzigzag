services:
  # Main web service - Node.js API + React frontend
  - type: web
    name: zigzag-web
    runtime: node
    region: oregon
    plan: starter # Upgrade to 'standard' for production
    buildCommand: |
      npm install
      npm run build:all
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://zigzag-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: zigzag-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: zigzag-redis
          property: connectionString
      - key: NEO4J_URI
        sync: false # Set manually after Neo4j AuraDB setup
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false # Set manually after Neo4j AuraDB setup
    autoDeploy: true # Auto-deploy on git push

  # Background worker for file processing and maintenance
  - type: worker
    name: zigzag-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm run build:worker
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zigzag-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: zigzag-redis
          property: connectionString
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
    autoDeploy: true

  # Redis for caching and sessions
  - type: redis
    name: zigzag-redis
    region: oregon
    plan: starter # 25MB RAM
    ipAllowList: [] # Allow connections from all Render services

databases:
  # PostgreSQL for structured data
  - name: zigzag-postgres
    databaseName: zigzag_production
    user: zigzag_admin
    region: oregon
    plan: starter # 256MB RAM, 1GB storage
    ipAllowList: [] # Allow connections from all Render services

# Environment groups for shared configuration
envVarGroups:
  - name: zigzag-shared
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: MAX_FILE_SIZE
        value: "10485760" # 10MB
      - key: ALLOWED_ORIGINS
        value: https://zigzag-web.onrender.com
      - key: SESSION_TIMEOUT
        value: "86400000" # 24 hours in ms
      - key: RATE_LIMIT_WINDOW
        value: "900000" # 15 minutes in ms
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"

# Build & Deploy Configuration
buildFilter:
  paths:
    - packages/**
  ignoredPaths:
    - "**/*.test.ts"
    - "**/*.spec.ts"
    - "**/test/**"
    - "**/tests/**"
    - "**/__tests__/**"

# Preview Environments (optional)
previewsEnabled: true
previewsExpireAfterDays: 3

# Headers for security and performance
headers:
  - path: /*
    name: X-Frame-Options
    value: DENY
  - path: /*
    name: X-Content-Type-Options
    value: nosniff
  - path: /*
    name: X-XSS-Protection
    value: 1; mode=block
  - path: /*
    name: Referrer-Policy
    value: strict-origin-when-cross-origin
  - path: /api/*
    name: Cache-Control
    value: no-cache, no-store, must-revalidate
  - path: /static/*
    name: Cache-Control
    value: public, max-age=31536000, immutable

# Redirects
redirects:
  - source: /
    destination: /app
    type: 301

# Health checks
healthCheck:
  httpPath: /health
  httpMethod: GET
  intervalSeconds: 30
  timeoutSeconds: 10
  numFailures: 3