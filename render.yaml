services:
  # Web service for the Node.js backend
  - type: web
    name: zigzag-api
    runtime: node
    repo: https://github.com/adammoore/gzigzag
    branch: phase-4c-modernized
    rootDir: web
    buildCommand: npm install && npm run build:all
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zigzag-db
          property: connectionString
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: CLIENT_URL
        value: https://gzigzag-modern-client.onrender.com

  # Static site for the React frontend
  - type: web
    name: zigzag-client
    runtime: static
    repo: https://github.com/adammoore/gzigzag
    branch: phase-4c-modernized
    rootDir: web
    buildCommand: npm install && npm run build:client
    staticPublishPath: ./packages/client/dist
    envVars:
      - key: VITE_API_URL
        value: https://gzigzag-modern.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # PostgreSQL database
  - name: zigzag-db
    plan: starter

