name: Deploy to Render

on:
  push:
    branches:
      - main
      - phase-4c-cloud-deployment
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: zigzag_user
          POSTGRES_PASSWORD: zigzag_password
          POSTGRES_DB: zigzag_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
      
      - name: Run linter
        working-directory: ./web
        run: npm run lint || true
      
      - name: Build packages
        working-directory: ./web
        run: npm run build:all
      
      - name: Run tests
        working-directory: ./web
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: zigzag_db
          DB_USER: zigzag_user
          DB_PASSWORD: zigzag_password
        run: npm test || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/phase-4c-cloud-deployment'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Render
        env:
          RENDER_API_KEY: \${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: \${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer \$RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/\$RENDER_SERVICE_ID/deploys" \
            -d '{"clearCache": false}'
